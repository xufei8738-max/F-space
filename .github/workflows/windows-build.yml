# 精简版 Windows 构建工作流：零 secret、不带自动更新产物。
#
# 与源码包内原始 windows-build.yml 的差异：
#   1. 移除 TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD /
#      TAURI_UPDATER_PUBLIC_KEY 三个自动更新密钥 —— 因此仓库无需配置任何 Secret 即可跑通。
#   2. 追加 --config '{"bundle":{"createUpdaterArtifacts":false}}'，
#      覆盖 tauri.windows.release.conf.json 里的 createUpdaterArtifacts:true，
#      不再生成 *.sig 与 latest.json。
#   3. 去掉对 *.sig 的断言与拷贝；portable.zip 改为「找到就打包，找不到就跳过」。
#   4. pnpm 安装改为全量 --frozen-lockfile（原为 --filter oneagent...，过滤器名称与
#      @oneagent/* 包名不匹配，有失败风险）。
name: Windows Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag for the build, for example v1.3.0-dev.0
        required: true
        default: v1.3.0-dev.0

permissions:
  contents: read

env:
  NODE_VERSION: 22.19.0

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install pnpm
        run: npm install -g pnpm@10.32.1

      - uses: dtolnay/rust-toolchain@stable

      # agent-gui 的 build.rs 用 prost_build 在编译期从 .proto 生成 Rust 代码，需要 PATH 上有 protoc。
      - name: Install protobuf compiler
        run: |
          choco install protoc -y --no-progress
          "$env:ChocolateyInstall\lib\protoc\tools\bin" | Out-File -Append $env:GITHUB_PATH

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/agent-gui/src-tauri

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare release version config
        shell: bash
        working-directory: crates/agent-gui
        run: node ../../scripts/release/prepare-app-version-from-tag.mjs "$RELEASE_TAG" --github-env "$GITHUB_ENV" --tauri-config src-tauri/tauri.version.generated.conf.json --json

      - name: Build Windows bundles
        working-directory: crates/agent-gui
        shell: bash
        run: |
          pnpm tauri build \
            --config src-tauri/tauri.windows.release.conf.json \
            --config "$ONEAGENT_TAURI_VERSION_CONFIG" \
            --config '{"bundle":{"createUpdaterArtifacts":false}}' \
            --target x86_64-pc-windows-msvc

      - name: Stage Windows artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          msi_path="$(find target crates/agent-gui/src-tauri/target -type f -name '*.msi' -path '*bundle*' -print -quit 2>/dev/null || true)"
          setup_path="$(find target crates/agent-gui/src-tauri/target -type f -name '*setup.exe' -path '*bundle*' -print -quit 2>/dev/null || true)"
          test -n "$msi_path"
          test -n "$setup_path"

          cp "$msi_path" "dist/OneAgent-${RELEASE_TAG}-Windows-x64.msi"
          cp "$setup_path" "dist/OneAgent-${RELEASE_TAG}-Windows-x64-Setup.exe"

          portable_exe_path="$(find target crates/agent-gui/src-tauri/target -type f -name 'oneagent.exe' -path '*/release/*' ! -path '*bundle*' -print -quit 2>/dev/null || true)"
          if [ -n "$portable_exe_path" ]; then
            mkdir -p dist/portable/OneAgent
            cp "$portable_exe_path" dist/portable/OneAgent/OneAgent.exe
            powershell -NoProfile -Command "Compress-Archive -Path 'dist/portable/OneAgent/*' -DestinationPath 'dist/OneAgent-${RELEASE_TAG}-Windows-x64-portable.zip' -Force"
            rm -rf dist/portable
          else
            echo "portable exe not found, skipping portable.zip"
          fi

          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: oneagent-windows-x64
          path: dist/*
          if-no-files-found: error
